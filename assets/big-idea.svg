  <text x="464" y="80" font-family="ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,sans-serif" font-size="30" font-weight="800" fill="#ffb020" text-anchor="middle" opacity="0.45" filter="url(#glowS)">How the switchyard decides</text>
<text x="464" y="80" font-family="ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,sans-serif" font-size="30" font-weight="800" fill="#f1f5f9" text-anchor="middle">How the switchyard decides</text>
